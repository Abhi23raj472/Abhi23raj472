<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="860" height="280" role="img" aria-label="Hey, I'm Abhishek. Quality Engineer.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset=".5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="560" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset=".5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".08"/>
    </pattern>
    <clipPath id="card"><rect width="860" height="280" rx="16"/></clipPath>
    <clipPath id="titleClip"><rect x="0" y="72" width="860" height="76"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }

    .orb { transform-box: fill-box; transform-origin: center; animation: drift 12s ease-in-out infinite alternate; }
    .o2 { animation-duration: 15s; animation-direction: alternate-reverse; }
    .o3 { animation-duration: 10s; animation-delay: -4s; }
    @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(60px, 30px) scale(1.18); } }

    .pill { transform-box: fill-box; transform-origin: center; animation: pop .7s cubic-bezier(.34, 1.56, .64, 1) .1s both; }
    @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }

    .hand { transform-box: fill-box; transform-origin: 70% 80%; animation: wave 2.6s ease-in-out 1s infinite; }
    @keyframes wave { 0%, 60%, 100% { transform: rotate(0deg); } 10%, 30% { transform: rotate(18deg); } 20%, 40% { transform: rotate(-10deg); } 50% { transform: rotate(8deg); } }

    .title { animation: rise .9s cubic-bezier(.22, 1.2, .36, 1) .35s both; }
    @keyframes rise { from { transform: translateY(84px); } to { transform: translateY(0); } }

    .line { stroke-dasharray: 260; animation: draw .9s cubic-bezier(.65, 0, .35, 1) 1s both; }
    @keyframes draw { from { stroke-dashoffset: 260; } to { stroke-dashoffset: 0; } }

    .tag { opacity: 0; animation: cycle 9s ease-in-out infinite both; }
    .t1 { opacity: 1; animation-delay: 1.4s; }
    .t2 { animation-delay: 4.4s; }
    .t3 { animation-delay: 7.4s; }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(14px); } 5%, 30% { opacity: 1; transform: translateY(0); } 35%, 100% { opacity: 0; transform: translateY(-14px); } }

    .chase { animation: crawl 18s linear infinite; }
    @keyframes crawl { from { transform: translateX(140px); } to { transform: translateX(-850px); } }
    .bug { animation: wiggle .3s ease-in-out infinite alternate; }
    @keyframes wiggle { from { transform: translateY(0); } to { transform: translateY(-2px); } }
    .lens { transform-box: fill-box; transform-origin: center; animation: bob 1.2s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="860" height="280" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="orb o1" cx="140" cy="60" r="90" fill="#a855f7" fill-opacity=".55"/>
      <circle class="orb o2" cx="720" cy="230" r="110" fill="#22d3ee" fill-opacity=".4"/>
      <circle class="orb o3" cx="520" cy="20" r="70" fill="#ec4899" fill-opacity=".4"/>
    </g>
    <rect width="860" height="280" fill="url(#dots)"/>

    <g class="pill">
      <rect x="310" y="30" width="240" height="30" rx="15" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
      <text class="hand" x="334" y="51" font-size="16" text-anchor="middle">👋</text>
      <text x="444" y="50" font-size="12" font-weight="600" letter-spacing="2" fill="#e9d5ff" text-anchor="middle">QUALITY ENGINEER</text>
    </g>

    <g clip-path="url(#titleClip)">
      <text class="title" x="430" y="128" font-size="52" font-weight="700" fill="#ffffff" text-anchor="middle">Hey, I'm Abhishek</text>
    </g>
    <path class="line" d="M300 160 H560" stroke="url(#ink)" stroke-width="4" stroke-linecap="round" fill="none"/>

    <text class="tag t1" x="430" y="204" font-size="18" fill="#cbd5e1" text-anchor="middle">Breaking software so users don't have to</text>
    <text class="tag t2" x="430" y="204" font-size="18" fill="#cbd5e1" text-anchor="middle">Test automation with Playwright</text>
    <text class="tag t3" x="430" y="204" font-size="18" fill="#cbd5e1" text-anchor="middle">Always learning, always shipping</text>

    <g class="chase">
      <text class="bug" x="760" y="264" font-size="18">🐛</text>
      <text class="lens" x="800" y="264" font-size="18">🔍</text>
    </g>
  </g>
</svg>
